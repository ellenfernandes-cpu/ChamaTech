# MODELO de Secret — NÃO coloque senhas reais aqui.
# Esta pasta (k8s/exemplos/) não é aplicada pelo "kubectl apply -f k8s/".
#
# Forma recomendada de criar o Secret (sem arquivo no repositório):
#
#   kubectl create secret generic chamatech-secret -n chamatech \
#     --from-literal=POSTGRES_USER=chamatech \
#     --from-literal=POSTGRES_PASSWORD=sua-senha \
#     --from-literal=DATABASE_URL=postgresql://chamatech:sua-senha@db:5432/chamatech
#
apiVersion: v1
kind: Secret
metadata:
  name: chamatech-secret
  namespace: chamatech
type: Opaque
stringData:
  POSTGRES_USER: "chamatech"
  POSTGRES_PASSWORD: "troque-esta-senha"
  DATABASE_URL: "postgresql://chamatech:troque-esta-senha@db:5432/chamatech"
