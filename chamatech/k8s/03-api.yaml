apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: chamatech
  labels: { app: api }
spec:
  replicas: 2                      # múltiplas réplicas desde o início
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
      annotations:                 # permite que o Prometheus descubra os pods
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics/"
    spec:
      containers:
        - name: api
          image: chamatech-api:latest
          imagePullPolicy: IfNotPresent   # usa a imagem carregada no Minikube/kind
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              valueFrom: { configMapKeyRef: { name: chamatech-config, key: APP_ENV } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: chamatech-secret, key: DATABASE_URL } }
          resources:                # obrigatório para o HPA calcular o uso de CPU
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api                        # mesmo nome usado no nginx.conf
  namespace: chamatech
spec:
  selector: { app: api }
  ports:
    - port: 8000
      targetPort: 8000
